<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - One More Shot</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#faf6f0',
                            purple: '#7d38be',
                            lavender: '#e8ddf5',
                            dark: '#261a38',
                            muted: '#6f6280',
                            border: '#e8ddf5'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        handwriting: ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #faf6f0;
            background-image: radial-gradient(#d6c7ea 1px, transparent 1px);
            background-size: 20px 20px;
            color: #261a38;
        }

        .card {
            background: white;
            border: 1px solid #e8ddf5;
            border-radius: 1.5rem; /* rounded-3xl */
        }
        
        .transition-colors {
            transition: all 0.3s ease;
        }

        .toast {
            animation: slideIn 0.3s ease-out forwards, fadeOut 0.3s ease-out 2.7s forwards;
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e8ddf5;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7d38be;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    
    <!-- Header -->
    <header class="card mx-4 mt-4 mb-2 p-4 flex flex-col md:flex-row items-center justify-between shadow-sm z-10 shrink-0">
        <div class="flex items-center gap-4 mb-4 md:mb-0">
            <div class="flex flex-col">
                <h1 class="text-2xl font-bold text-brand-dark flex items-center gap-2">
                    <i data-lucide="camera" class="text-brand-purple"></i>
                    One More Shot
                </h1>
                <span class="text-sm font-handwriting text-brand-purple text-lg">Admin Dashboard</span>
            </div>
            <div class="h-8 w-px bg-brand-border mx-2"></div>
            <div id="ws-status" class="flex items-center gap-2 text-sm font-medium text-brand-muted">
                <div class="w-2.5 h-2.5 rounded-full bg-red-500 transition-colors" id="ws-dot"></div>
                <span id="ws-text">Disconnected</span>
            </div>
        </div>

        <div class="flex items-center gap-5 bg-brand-bg px-6 py-2 rounded-2xl border border-brand-border">
            <div class="text-center">
                <div class="text-xs text-brand-muted uppercase tracking-wider font-bold">Active Orders</div>
                <div class="text-xl font-bold" id="stat-total">0</div>
            </div>
            <div class="text-center">
                <div class="text-xs text-brand-muted uppercase tracking-wider font-bold">Pending</div>
                <div class="text-xl font-bold text-amber-600" id="stat-pending">0</div>
            </div>
            <div class="text-center">
                <div class="text-xs text-brand-muted uppercase tracking-wider font-bold">Approved</div>
                <div class="text-xl font-bold text-green-600" id="stat-approved">0</div>
            </div>
            <div class="text-center">
                <div class="text-xs text-brand-muted uppercase tracking-wider font-bold">Previous Orders</div>
                <div class="text-xl font-bold text-purple-700" id="stat-previous">0</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 overflow-hidden">
        
        <!-- Left Sidebar (Orders List) -->
        <aside class="card w-full md:w-[32%] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-brand-border shrink-0 space-y-2.5">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-brand-dark" id="sidebar-title">Incoming Orders</h2>
                    <span id="orders-count-badge" class="text-xs font-mono font-bold text-brand-purple bg-brand-lavender px-2 py-0.5 rounded-full">0</span>
                </div>
                <!-- Filter Bar: All, Pending, Approved, Previous Orders -->
                <div class="flex gap-1 text-xs bg-brand-bg p-1 rounded-xl">
                    <button class="filter-btn flex-1 py-1 px-1 rounded-lg bg-white shadow-sm font-medium transition-all text-center" data-filter="all">All</button>
                    <button class="filter-btn flex-1 py-1 px-1 rounded-lg hover:bg-white/50 text-brand-muted transition-all text-center" data-filter="pending">Pending</button>
                    <button class="filter-btn flex-1 py-1 px-1 rounded-lg hover:bg-white/50 text-brand-muted transition-all text-center" data-filter="approved">Approved</button>
                    <button class="filter-btn flex-1 py-1 px-1 rounded-lg hover:bg-white/50 text-brand-muted transition-all text-center" data-filter="previous">Previous Orders</button>
                </div>
                <!-- Multi-Order Batch Print Button (excludes already printed orders) -->
                <button onclick="batchGenerateAllReady()" class="w-full py-2 px-3 rounded-xl bg-gradient-to-r from-purple-700 to-indigo-700 hover:from-purple-800 hover:to-indigo-800 text-white text-xs font-bold flex items-center justify-center gap-1.5 transition shadow-xs">
                    <i data-lucide="layers" class="w-3.5 h-3.5"></i>
                    <span>Batch Print All Approved Orders</span>
                </button>
            </div>
            
            <div id="orders-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Skeleton Loader -->
                <div class="loading-skeleton space-y-3">
                    <div class="skeleton h-24 rounded-2xl w-full"></div>
                    <div class="skeleton h-24 rounded-2xl w-full"></div>
                    <div class="skeleton h-24 rounded-2xl w-full"></div>
                </div>
                <!-- Orders will be injected here -->
            </div>
        </aside>

        <!-- Right Panel (Order Details) -->
        <section class="card w-full md:w-[68%] flex flex-col overflow-hidden relative">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-white rounded-3xl z-10 transition-opacity duration-300">
                <i data-lucide="inbox" class="w-16 h-16 text-brand-lavender mb-4"></i>
                <h3 class="text-xl font-bold text-brand-dark">Waiting for orders...</h3>
                <p class="text-brand-muted mt-2">Select an order from the list to view details.</p>
            </div>

            <!-- Order Header with Quick Actions -->
            <div class="p-6 border-b border-brand-border shrink-0 flex flex-wrap gap-4 justify-between items-center bg-white/70 z-0">
                <div>
                    <h2 class="text-2xl font-bold text-brand-dark flex items-center gap-3">
                        Order <span id="detail-order-id" class="text-brand-purple">#---</span>
                        <span id="detail-order-status-badge" class="hidden text-xs font-semibold px-2.5 py-1 rounded-full"></span>
                    </h2>
                    <p id="detail-order-time" class="text-xs text-brand-muted mt-0.5">---</p>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <div class="text-[10px] text-brand-muted font-bold uppercase tracking-wider">Prints in Order</div>
                        <div id="detail-order-prints" class="text-2xl font-extrabold text-brand-purple">0</div>
                    </div>
                    
                    <button id="btn-approve-all" onclick="approveAllSelectedOrder()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition transform active:scale-95">
                        <i data-lucide="check-check" class="w-4 h-4"></i>
                        <span>Approve All</span>
                    </button>
                </div>
            </div>

            <!-- Rejected Filter Toggle Notice Bar -->
            <div id="rejected-notice-bar" class="hidden px-6 py-2 bg-amber-50 border-b border-amber-200 text-xs text-amber-800 flex items-center justify-between z-0">
                <span id="rejected-notice-text">1 item rejected and hidden from print</span>
                <button onclick="toggleShowRejected()" id="btn-toggle-rejected" class="font-bold underline text-amber-900 hover:text-brand-purple transition">
                    Show Rejected
                </button>
            </div>

            <div id="items-grid" class="flex-1 overflow-y-auto p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 z-0 bg-brand-bg/30">
                <!-- Items will be injected here -->
            </div>

            <!-- Bottom Action Bar -->
            <div class="p-4 border-t border-brand-border bg-white shrink-0 z-0 flex items-center justify-between">
                <div id="action-status" class="text-xs font-semibold text-brand-muted flex items-center gap-2">
                    Waiting for action...
                </div>
                <div class="flex gap-2.5 items-center">
                    <button id="btn-generate" disabled class="px-6 py-2.5 rounded-xl font-bold bg-brand-purple text-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-brand-dark transition-colors flex items-center gap-2 shadow-sm text-xs">
                        <i data-lucide="printer" class="w-4 h-4"></i> Generate Print Sheet
                    </button>
                    <button id="btn-download" disabled class="px-5 py-2.5 rounded-xl font-bold bg-emerald-600 text-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-700 transition-colors flex items-center gap-2 hidden shadow-sm text-xs">
                        <i data-lucide="download" class="w-4 h-4"></i> Download PDF & Mark Done
                    </button>
                    <button id="btn-mark-printed" class="px-4 py-2.5 rounded-xl font-bold bg-purple-700 text-white hover:bg-purple-800 transition-colors flex items-center gap-2 hidden shadow-sm text-xs">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Mark Done
                    </button>
                    <button id="btn-restore-active" class="px-4 py-2.5 rounded-xl font-bold bg-slate-600 text-white hover:bg-slate-700 transition-colors flex items-center gap-2 hidden shadow-sm text-xs">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Move back to Active
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Toasts Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // State
        let orders = [];
        let selectedOrderId = null;
        let currentFilter = 'all';
        let wsReconnectAttempts = 0;
        let ws;

        // Elements
        const ordersListEl = document.getElementById('orders-list');
        const emptyStateEl = document.getElementById('empty-state');
        const itemsGridEl = document.getElementById('items-grid');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const btnGenerate = document.getElementById('btn-generate');
        const btnDownload = document.getElementById('btn-download');
        const btnMarkPrinted = document.getElementById('btn-mark-printed');
        const btnRestoreActive = document.getElementById('btn-restore-active');
        const btnApproveAll = document.getElementById('btn-approve-all');
        const actionStatus = document.getElementById('action-status');

        // Helper: Time ago
        function timeAgo(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const seconds = Math.floor((new Date() - date) / 1000);
            
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + ' years ago';
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + ' months ago';
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + ' days ago';
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + ' hours ago';
            interval = seconds / 60;
            if (interval >= 1) return Math.floor(interval) + ' mins ago';
            return Math.floor(seconds) + ' seconds ago';
        }

        // Update timestamps periodically
        setInterval(() => {
            renderOrderList();
            if (selectedOrderId) updateOrderDetailsHeader();
        }, 60000);

        // Toast Notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-circle' : 'info');
            const color = type === 'success' ? 'text-green-500' : (type === 'error' ? 'text-red-500' : 'text-purple-600');
            const bgColor = type === 'success' ? 'bg-green-50 border-green-200' : (type === 'error' ? 'bg-red-50 border-red-200' : 'bg-purple-50 border-purple-200');
            
            toast.className = `toast flex items-center gap-3 p-4 rounded-2xl border shadow-lg ${bgColor}`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 ${color}"></i>
                <span class="font-medium text-brand-dark">${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => {
                toast.remove();
            }, 3500);
        }

        // WebSocket Connection
        function connectWS() {
            const wsDot = document.getElementById('ws-dot');
            const wsText = document.getElementById('ws-text');

            wsText.innerText = 'Connecting...';
            wsDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-500 transition-colors';

            try {
                const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${wsProtocol}//${location.host}`);

                ws.onopen = () => {
                    wsText.innerText = 'Connected';
                    wsDot.className = 'w-2.5 h-2.5 rounded-full bg-green-500 transition-colors shadow-[0_0_8px_rgba(34,197,94,0.6)]';
                    wsReconnectAttempts = 0;
                };

                ws.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.event === 'new_order') {
                            addOrder(data.order);
                            showToast('New order received! 🎉', 'success');
                        }
                        if (data.event === 'pdf_ready') {
                            showToast('PDF is ready! Click Download.', 'success');
                            const order = orders.find(o => o.id === data.orderId || o.orderId === data.orderId);
                            if (order) {
                                order.status = 'ready';
                                renderOrderList();
                                if (selectedOrderId === data.orderId) renderOrderDetails();
                            }
                        }
                        if (data.event === 'order_printed') {
                            const order = orders.find(o => o.id === data.orderId || o.orderId === data.orderId);
                            if (order) {
                                order.status = 'printed';
                                order.printedAt = data.order?.printedAt || new Date().toISOString();
                                updateStats();
                                renderOrderList();
                                if (selectedOrderId === data.orderId) renderOrderDetails();
                            }
                        }
                    } catch (err) {
                        console.error('WS message error:', err);
                    }
                };

                ws.onclose = () => {
                    wsText.innerText = 'Reconnecting...';
                    wsDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500 transition-colors';
                    setTimeout(connectWS, 3000);
                };
                
                ws.onerror = () => {
                    ws.close();
                };
            } catch (err) {
                setTimeout(connectWS, 3000);
            }
        }

        // Fetch initial data
        async function fetchOrders() {
            try {
                document.querySelector('.loading-skeleton')?.remove();
                
                const response = await fetch('/api/orders').catch(() => null);
                if (response && response.ok) {
                    const data = await response.json();
                    orders = data;
                } else {
                    // Fallback mock data for testing
                    orders = [
                        {
                            id: 'ord-1a2b3c4d',
                            createdAt: new Date(Date.now() - 5*60000).toISOString(),
                            status: 'pending',
                            items: [
                                { id: 'itm-1', type: 'mini', photoUrl: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&q=80', caption: 'Best day ever', copies: 2, status: 'pending' },
                                { id: 'itm-2', type: 'wide', photoUrl: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=400&q=80', caption: 'Team outing', copies: 1, status: 'pending' }
                            ]
                        },
                        {
                            id: 'ord-9f8e7d6c',
                            createdAt: new Date(Date.now() - 3600000).toISOString(),
                            status: 'partial',
                            items: [
                                { id: 'itm-3', type: 'mini', photoUrl: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=400&q=80', caption: 'Nature walk', copies: 3, status: 'approved' },
                                { id: 'itm-4', type: 'mini', photoUrl: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400&q=80', caption: 'Blurry one', copies: 1, status: 'rejected' }
                            ]
                        }
                    ];
                }
                
                updateStats();
                renderOrderList();
            } catch (error) {
                console.error('Error fetching orders:', error);
                showToast('Failed to load orders', 'error');
            }
        }

        function addOrder(order) {
            orders.unshift(order);
            updateStats();
            renderOrderList();
        }

        // Update stats bar: Total Active, Pending prints, Approved prints, Previous Orders
        function updateStats() {
            const activeOrders = orders.filter(o => o.status !== 'printed');
            const previousOrders = orders.filter(o => o.status === 'printed');

            let itemsPending = 0;
            let itemsApproved = 0;
            activeOrders.forEach(o => {
                o.items.forEach(i => {
                    if (i.status === 'pending') itemsPending++;
                    if (i.status === 'approved') itemsApproved++;
                });
            });

            document.getElementById('stat-total').innerText = activeOrders.length;
            document.getElementById('stat-pending').innerText = itemsPending;
            document.getElementById('stat-approved').innerText = itemsApproved;
            document.getElementById('stat-previous').innerText = previousOrders.length;
        }

        // Render functions
        function renderOrderList() {
            ordersListEl.innerHTML = '';
            
            // Filter logic:
            // 'all': active orders only (excludes printed/completed)
            // 'pending': active orders with pending status or items
            // 'approved': active orders with approved or ready status
            // 'previous': orders that are printed / completed
            let filtered = [];
            if (currentFilter === 'all') {
                filtered = orders.filter(o => o.status !== 'printed');
            } else if (currentFilter === 'pending') {
                filtered = orders.filter(o => o.status !== 'printed' && (o.status === 'pending' || o.items.some(i => i.status === 'pending')));
            } else if (currentFilter === 'approved') {
                filtered = orders.filter(o => o.status !== 'printed' && (o.status === 'ready' || o.status === 'approved' || (o.items.length > 0 && o.items.every(i => i.status === 'approved'))));
            } else if (currentFilter === 'previous') {
                filtered = orders.filter(o => o.status === 'printed');
            }

            // Update badge count
            document.getElementById('orders-count-badge').innerText = filtered.length;

            if (filtered.length === 0) {
                const emptyMsg = currentFilter === 'previous' 
                    ? 'No previous orders yet. Once you download or batch print orders, they will appear here.'
                    : 'No active orders in this view.';
                ordersListEl.innerHTML = `<div class="text-center text-brand-muted py-8 text-xs px-4">${emptyMsg}</div>`;
                return;
            }

            filtered.forEach(order => {
                const totalPrints = order.items.reduce((sum, item) => sum + (item.copies || 1), 0);
                const shortId = (order.id || order.orderId || '').substring(0, 8);
                
                // Determine badge
                let badgeClass = 'bg-brand-lavender text-brand-purple';
                let badgeText = 'Pending';
                
                const approvedCount = order.items.filter(i => i.status === 'approved').length;
                const rejectedCount = order.items.filter(i => i.status === 'rejected').length;
                const totalItems = order.items.length;

                if (order.status === 'printed') {
                    badgeClass = 'bg-purple-100 text-purple-800 border border-purple-200';
                    badgeText = '✓ Printed';
                } else if (order.status === 'ready') {
                    badgeClass = 'bg-green-100 text-green-700';
                    badgeText = 'Ready';
                } else if (approvedCount + rejectedCount === totalItems && totalItems > 0) {
                    badgeClass = 'bg-blue-100 text-blue-700';
                    badgeText = 'Reviewed';
                } else if (approvedCount > 0 || rejectedCount > 0) {
                    badgeClass = 'bg-amber-100 text-amber-700';
                    badgeText = 'Partial';
                }

                const isSelected = order.id === selectedOrderId;
                const selectedClass = isSelected ? 'ring-2 ring-brand-purple bg-brand-lavender/30' : 'hover:border-brand-purple hover:shadow-md';

                const el = document.createElement('div');
                el.className = `p-4 border border-brand-border rounded-2xl cursor-pointer transition-all bg-white ${selectedClass}`;
                el.onclick = () => selectOrder(order.id);
                
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold font-mono text-sm">#${shortId}</span>
                        <span class="text-xs font-medium px-2 py-1 rounded-lg ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="text-xs text-brand-muted mb-3 flex items-center gap-1">
                        <i data-lucide="clock" class="w-3 h-3"></i> ${timeAgo(order.createdAt)}
                    </div>
                    <div class="flex justify-between items-center text-sm font-medium">
                        <span>${totalItems} items</span>
                        <span>${totalPrints} prints total</span>
                    </div>
                `;
                
                ordersListEl.appendChild(el);
            });
            lucide.createIcons();
        }

        function selectOrder(id) {
            selectedOrderId = id;
            renderOrderList();
            renderOrderDetails();
        }

        function updateOrderDetailsHeader() {
            const order = orders.find(o => o.id === selectedOrderId || o.orderId === selectedOrderId);
            if (!order) return;
            document.getElementById('detail-order-id').innerText = '#' + (order.id || order.orderId).substring(0, 8);
            document.getElementById('detail-order-time').innerText = timeAgo(order.createdAt);

            const badgeEl = document.getElementById('detail-order-status-badge');
            if (order.status === 'printed') {
                badgeEl.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200';
                badgeEl.innerText = 'Previous / Printed';
                badgeEl.classList.remove('hidden');
            } else if (order.status === 'ready') {
                badgeEl.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-green-100 text-green-700';
                badgeEl.innerText = 'Ready to Print';
                badgeEl.classList.remove('hidden');
            } else {
                badgeEl.classList.add('hidden');
            }
        }

        let showRejected = false;

        function toggleShowRejected() {
            showRejected = !showRejected;
            renderOrderDetails();
        }

        function renderOrderDetails() {
            if (!selectedOrderId) {
                emptyStateEl.style.opacity = '1';
                emptyStateEl.style.pointerEvents = 'auto';
                return;
            }

            const order = orders.find(o => o.id === selectedOrderId || o.orderId === selectedOrderId);
            if (!order) return;

            emptyStateEl.style.opacity = '0';
            emptyStateEl.style.pointerEvents = 'none';

            updateOrderDetailsHeader();
            
            // Only count active (non-rejected) items towards print total
            const printableItems = order.items.filter(item => item.status !== 'rejected');
            const totalPrints = printableItems.reduce((sum, item) => sum + (item.copies || 1), 0);
            document.getElementById('detail-order-prints').innerText = totalPrints;

            // Handle Rejected Notice Bar
            const rejectedCount = order.items.filter(item => item.status === 'rejected').length;
            const noticeBar = document.getElementById('rejected-notice-bar');
            const noticeText = document.getElementById('rejected-notice-text');
            const toggleBtn = document.getElementById('btn-toggle-rejected');

            if (rejectedCount > 0) {
                noticeBar.classList.remove('hidden');
                noticeText.innerText = `${rejectedCount} item${rejectedCount === 1 ? '' : 's'} rejected & excluded from printing`;
                toggleBtn.innerText = showRejected ? 'Hide Rejected' : 'Show Rejected';
            } else {
                noticeBar.classList.add('hidden');
            }

            // Filter items: exclude rejected unless showRejected is explicitly toggled on
            const displayItems = showRejected ? order.items : printableItems;

            // Render Items
            itemsGridEl.innerHTML = '';
            if (displayItems.length === 0) {
                itemsGridEl.innerHTML = `
                    <div class="col-span-full py-12 text-center">
                        <p class="text-sm font-bold text-brand-muted">No active items to print.</p>
                        <p class="text-xs text-brand-muted mt-1">All items in this order were rejected.</p>
                    </div>
                `;
            }

            displayItems.forEach(item => {
                let statusClass = 'border-brand-border bg-white';
                let statusBadge = '';
                
                if (item.status === 'approved') {
                    statusClass = 'border-emerald-500 shadow-[0_0_0_1px_rgba(16,185,129,1)] bg-emerald-50/40';
                    statusBadge = `<div class="absolute top-2 right-2 bg-emerald-500 text-white p-1 rounded-full shadow"><i data-lucide="check" class="w-3.5 h-3.5"></i></div>`;
                } else if (item.status === 'rejected') {
                    statusClass = 'border-rose-400 opacity-60 bg-rose-50/50';
                    statusBadge = `<div class="absolute top-2 right-2 bg-rose-500 text-white p-1 rounded-full shadow"><i data-lucide="x" class="w-3.5 h-3.5"></i></div>`;
                }

                const aspectClass = (item.type === 'mini' || item.format === 'mini') ? 'aspect-[3/4]' : 'aspect-[4/3]';

                const el = document.createElement('div');
                el.className = `p-3.5 rounded-2xl border-2 transition-all duration-300 relative ${statusClass}`;
                el.dataset.itemId = item.id;
                
                el.innerHTML = `
                    ${statusBadge}
                    <div class="relative w-full ${aspectClass} bg-slate-900 rounded-xl overflow-hidden mb-3 border border-purple-100 shadow-2xs">
                        <img src="${item.photoUrl}" class="w-full h-full object-cover" alt="Polaroid photo">
                    </div>
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1 pr-2">
                            <div class="text-[10px] font-bold uppercase tracking-wider text-brand-purple mb-0.5">${item.type || item.format} Format</div>
                            <p class="text-sm font-handwriting text-lg leading-tight line-clamp-2 text-slate-800" title="${item.caption || 'No caption'}">${item.caption || '<span class="text-gray-400 italic">No caption</span>'}</p>
                        </div>
                        <div class="bg-brand-lavender px-2 py-0.5 rounded-lg text-xs font-bold font-mono text-brand-purple shrink-0">
                            x${item.copies}
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="handleItemAction('${order.id}', '${item.id}', 'approve')" class="flex-1 py-1.5 rounded-lg border border-emerald-500 text-emerald-600 hover:bg-emerald-500 hover:text-white font-bold transition flex items-center justify-center gap-1 text-xs ${item.status === 'approved' ? 'bg-emerald-500 text-white' : ''}">
                            <i data-lucide="check" class="w-3.5 h-3.5"></i> Approve
                        </button>
                        <button onclick="handleItemAction('${order.id}', '${item.id}', 'reject')" class="flex-1 py-1.5 rounded-lg border border-rose-500 text-rose-600 hover:bg-rose-500 hover:text-white font-bold transition flex items-center justify-center gap-1 text-xs ${item.status === 'rejected' ? 'bg-rose-500 text-white' : ''}">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i> Reject
                        </button>
                    </div>
                `;
                itemsGridEl.appendChild(el);
            });
            lucide.createIcons();

            // Update action bar
            updateActionBar(order);
        }

        function updateActionBar(order) {
            const approvedItems = order.items.filter(i => i.status === 'approved');
            const totalActive = order.items.filter(i => i.status !== 'rejected').length;
            const reviewedActive = approvedItems.length;

            if (order.status === 'printed') {
                actionStatus.innerHTML = `<span class="text-purple-700 font-bold flex items-center gap-1.5"><i data-lucide="check-check" class="w-4 h-4"></i> Order Completed & In Previous Orders ${order.printedAt ? '(' + timeAgo(order.printedAt) + ')' : ''}</span>`;
                btnGenerate.classList.add('hidden');
                
                // Can download again anytime
                btnDownload.classList.remove('hidden');
                btnDownload.disabled = false;
                btnDownload.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i> Download PDF Again`;
                btnDownload.onclick = () => downloadPDF(order.id, false);
                
                btnMarkPrinted.classList.add('hidden');
                
                // Allow moving back to active if desired
                btnRestoreActive.classList.remove('hidden');
                btnRestoreActive.onclick = () => restoreOrderActive(order.id);
            } else if (order.status === 'ready') {
                actionStatus.innerHTML = `<span class="text-green-700 font-bold flex items-center gap-1.5"><i data-lucide="check" class="w-4 h-4"></i> Print sheet ready! Click download to get PDF.</span>`;
                btnGenerate.classList.add('hidden');
                
                btnDownload.classList.remove('hidden');
                btnDownload.disabled = false;
                btnDownload.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i> Download PDF & Mark Done`;
                btnDownload.onclick = () => downloadPDF(order.id, true);
                
                btnMarkPrinted.classList.remove('hidden');
                btnMarkPrinted.onclick = () => markOrderPrinted(order.id);
                btnRestoreActive.classList.add('hidden');
            } else {
                actionStatus.innerText = `${reviewedActive} of ${totalActive} active items approved for printing`;
                btnGenerate.classList.remove('hidden');
                btnGenerate.disabled = approvedItems.length === 0;
                btnGenerate.innerHTML = `<i data-lucide="printer" class="w-4 h-4"></i> Generate Print Sheet`;
                btnGenerate.onclick = () => generateSheet(order.id);
                
                btnDownload.classList.add('hidden');
                btnMarkPrinted.classList.add('hidden');
                btnRestoreActive.classList.add('hidden');
            }
            lucide.createIcons();
        }

        // Approve All Items in the selected order
        async function approveAllSelectedOrder() {
            if (!selectedOrderId) return;
            const order = orders.find(o => o.id === selectedOrderId || o.orderId === selectedOrderId);
            if (!order) return;

            order.items.forEach(i => {
                if (i.status !== 'rejected') {
                    i.status = 'approved';
                }
            });
            if (order.status !== 'printed') {
                order.status = 'approved';
            }

            renderOrderDetails();
            updateStats();
            renderOrderList();
            showToast('All active items approved! Ready to print.', 'success');

            try {
                await fetch(`/api/orders/${order.id}/approve-all`, { method: 'POST' });
            } catch (err) {}
        }

        // Batch print across multiple customer orders (Excludes already printed orders!)
        async function batchGenerateAllReady() {
            // ONLY pick orders that are NOT in previous/printed orders and have approved items
            const readyOrders = orders.filter(o => o.status !== 'printed' && o.items.some(i => i.status === 'approved'));
            
            if (readyOrders.length === 0) {
                showToast('No new approved orders to batch print. (Previous orders are excluded)', 'info');
                return;
            }

            showToast(`Packing ${readyOrders.length} customer orders onto A4 sheets...`, 'info');
            try {
                const res = await fetch('/api/orders/batch-generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderIds: readyOrders.map(o => o.id) })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`Multi-Order PDF Ready! (${data.pages} Pages). Moved ${readyOrders.length} orders to Previous Orders!`, 'success');
                    
                    // Mark all batched orders as printed locally so they immediately separate!
                    const now = new Date().toISOString();
                    readyOrders.forEach(o => {
                        o.status = 'printed';
                        o.printedAt = now;
                    });
                    
                    window.open(`${data.pdfUrl}`, '_blank');
                    updateStats();
                    renderOrderList();
                    if (selectedOrderId) renderOrderDetails();
                } else {
                    showToast(data.error || 'Batch generation failed', 'error');
                }
            } catch (err) {
                showToast('Server error during batch generation', 'error');
            }
        }

        // Mark single order as printed / completed -> Moves to Previous Orders
        async function markOrderPrinted(orderId) {
            const order = orders.find(o => o.id === orderId || o.orderId === orderId);
            if (!order) return;

            order.status = 'printed';
            order.printedAt = new Date().toISOString();
            
            showToast('Order moved to Previous Orders! 🎉', 'success');
            updateStats();
            renderOrderList();
            if (selectedOrderId === orderId) renderOrderDetails();

            try {
                await fetch(`/api/orders/${orderId}/mark-printed`, { method: 'POST' });
            } catch (e) {
                console.warn('mark-printed backend sync:', e);
            }
        }

        // Restore single order back to active
        async function restoreOrderActive(orderId) {
            const order = orders.find(o => o.id === orderId || o.orderId === orderId);
            if (!order) return;

            order.status = 'ready';
            showToast('Order moved back to Active orders', 'info');
            updateStats();
            renderOrderList();
            if (selectedOrderId === orderId) renderOrderDetails();

            try {
                await fetch(`/api/orders/${orderId}/unmark-printed`, { method: 'POST' });
            } catch (e) {}
        }

        // Download PDF
        function downloadPDF(orderId, markAsDone = true) {
            showToast('Starting A4 Print Sheet download...', 'info');
            window.open(`/api/orders/${orderId}/download`, '_blank');
            
            if (markAsDone) {
                setTimeout(() => {
                    markOrderPrinted(orderId);
                }, 600);
            }
        }

        // Actions: Approve / Reject individual items
        async function handleItemAction(orderId, itemId, action) {
            const order = orders.find(o => o.id === orderId || o.orderId === orderId);
            if (!order) return;
            const item = order.items.find(i => String(i.id) === String(itemId));
            if (!item) return;

            const newStatus = action === 'approve' ? 'approved' : 'rejected';
            item.status = newStatus;

            if (newStatus === 'rejected') {
                showToast('Item rejected and excluded from print sheet', 'info');
            } else {
                showToast('Item approved for printing!', 'success');
            }
            
            renderOrderDetails();
            updateStats();
            renderOrderList();

            try {
                await fetch(`/api/orders/${orderId}/items/${itemId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
            } catch (err) {
                console.warn('API call failed');
            }
        }

        async function generateSheet(orderId) {
            btnGenerate.disabled = true;
            const originalText = btnGenerate.innerHTML;
            btnGenerate.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Generating 300 DPI Sheet...`;
            lucide.createIcons();

            try {
                const response = await fetch(`/api/orders/${orderId}/generate`, { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    showToast('A4 Print Sheet generated successfully! 🎉', 'success');
                    const order = orders.find(o => o.id === orderId || o.orderId === orderId);
                    if (order) {
                        order.status = 'ready';
                    }
                    renderOrderList();
                    if (selectedOrderId === orderId) renderOrderDetails();
                } else {
                    showToast(result.error || 'Please approve at least 1 item to print', 'error');
                    btnGenerate.disabled = false;
                    btnGenerate.innerHTML = originalText;
                    lucide.createIcons();
                }
            } catch (err) {
                console.warn('Backend offline, running preview mode:', err);
                setTimeout(() => {
                    showToast('Print sheet generated! Ready to download.', 'success');
                    const order = orders.find(o => o.id === orderId || o.orderId === orderId);
                    if (order) order.status = 'ready';
                    renderOrderList();
                    if (selectedOrderId === orderId) renderOrderDetails();
                }, 1200);
            }
        }

        // Filters: All, Pending, Approved, Previous Orders
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.className = 'filter-btn flex-1 py-1 px-1 rounded-lg hover:bg-white/50 text-brand-muted transition-all text-center';
                });
                const target = e.currentTarget || e.target;
                target.className = 'filter-btn flex-1 py-1 px-1 rounded-lg bg-white shadow-sm font-medium transition-all text-center';
                
                currentFilter = target.dataset.filter;
                
                const titleMap = {
                    'all': 'Active Orders',
                    'pending': 'Pending Orders',
                    'approved': 'Approved Orders',
                    'previous': 'Previous Orders'
                };
                document.getElementById('sidebar-title').innerText = titleMap[currentFilter] || 'Orders';

                renderOrderList();
            });
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (!selectedOrderId) return;
            const order = orders.find(o => o.id === selectedOrderId || o.orderId === selectedOrderId);
            if (!order || order.status === 'printed') return;
            const pendingItem = order.items.find(i => i.status === 'pending');
            
            if (e.key.toLowerCase() === 'a' && pendingItem) {
                handleItemAction(order.id, pendingItem.id, 'approve');
            }
            if (e.key.toLowerCase() === 'r' && pendingItem) {
                handleItemAction(order.id, pendingItem.id, 'reject');
            }
        });

        // Init
        connectWS();
        fetchOrders();

    </script>
</body>
</html>
